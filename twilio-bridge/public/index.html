<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JRH Agent Console</title>
<link rel="stylesheet" href="styles.css" />
<script src="vendor/twilio.min.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Jackson Rental Homes</h1>
        <p>Agent Console</p>
      </div>
    </div>
    <div id="deviceState" class="pill pill-off">Device: offline</div>
  </header>

  <section id="loginCard" class="card">
    <h2>Sign in</h2>
    <label>Your name
      <input id="agentName" type="text" placeholder="e.g. Maria" autocomplete="off" />
    </label>
    <label id="pwLabel">Team password
      <input id="consolePw" type="password" placeholder="Shared team password" autocomplete="current-password" />
    </label>
    <button id="loginBtn" class="btn btn-primary">Go online</button>
    <p class="hint">Use a headset. Chrome will ask for microphone access — click Allow.</p>
  </section>

  <section id="consoleCard" class="card hidden">
    <div class="statusrow">
      <div>
        <span class="label">You</span>
        <span id="whoami" class="who"></span>
      </div>
      <div class="toggle">
        <span class="label">Status</span>
        <button id="availBtn" class="btn btn-avail">Available</button>
        <button id="awayBtn" class="btn btn-away">Away</button>
      </div>
    </div>

    <div class="queuebox">
      <div class="metric">
        <span id="qSize" class="big">0</span>
        <span class="cap">waiting in queue</span>
      </div>
      <div class="metric">
        <span id="qWait" class="big">0s</span>
        <span class="cap">avg wait</span>
      </div>
    </div>

    <div id="incoming" class="incoming hidden">
      <p>📞 Incoming caller</p>
      <div class="incoming-btns">
        <button id="answerBtn" class="btn btn-primary">Answer</button>
        <button id="declineBtn" class="btn btn-away">Decline</button>
      </div>
    </div>

    <div id="oncall" class="oncall hidden">
      <p>🔴 On call — <span id="callTimer">00:00</span></p>
      <button id="hangupBtn" class="btn btn-away">Hang up</button>
    </div>

    <button id="answerNextBtn" class="btn btn-outline">Answer next in queue</button>

    <div class="agents">
      <span class="label">Team</span>
      <ul id="agentList"></ul>
    </div>
  </section>

  <div id="log" class="log"></div>
</div>
<script src="app.js"></script>
</body>
</html>
